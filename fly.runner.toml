# The scheduled runner as its own Fly app (no public services).
#   fly launch --no-deploy -c fly.runner.toml --copy-config
#   fly secrets set -c fly.runner.toml RUNNER_TOKEN=<same as observer>
#   fly deploy -c fly.runner.toml
app = "anonscope-runner"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.runner"

[env]
  RUNNER_ORIGIN = "https://anonscope.fly.dev"
  RUNNER_NETWORKS = "passthrough,tor-js,nym,nox"
  RUNNER_INTERVAL_MIN = "30"
  RUNNER_HEADLESS = "new"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
